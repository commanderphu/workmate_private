# Installieren: venv/bin/pre-commit install
# Alle Dateien prüfen: venv/bin/pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Dieselben harten Regeln wie in .github/workflows/backend-ci.yml
  # (Syntaxfehler, undefinierte Namen) — fängt z. B. fehlende Imports ab
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^backend/
        args: ["--select=E9,F63,F7,F82", --show-source]
